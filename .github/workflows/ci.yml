name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  signal:
    name: signal (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: signal/go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -race -count=1

  web:
    name: web (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc -b --noEmit
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
