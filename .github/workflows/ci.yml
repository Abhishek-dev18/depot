name: CI

on:
  push:
    # Working branches too, not just main. The Android job exists to catch
    # what only a compiler can, and it was only running on main and on
    # pull requests — so a branch with a fortnight of work on it got no
    # build at all, and the first thing to find a broken import was
    # someone's laptop.
    branches: [main, 'claude/**']
  pull_request:

jobs:
  signal:
    name: signal (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: signal/go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -race -count=1

  web:
    name: web (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc -b --noEmit
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build

  android:
    name: android (Kotlin)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      # Compiling is the point of this job: it is the failure mode that
      # otherwise only shows up on someone's phone. The instrumented
      # suite runs separately, on an emulator — see `vectors`.
      - run: ./gradlew --no-daemon assembleDebug
      - run: ./gradlew --no-daemon testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-unit-test-results
          path: android/app/build/reports/tests/

  browser:
    name: browser (Playwright)
    runs-on: ubuntu-latest
    # The whole protocol through two real tabs: pairing, the SAS, §5.9
    # browsing, a verified transfer, the cache surviving a reload, and
    # the origin-isolation check behind the PDF preview. None of it is
    # reachable from a unit test — there is no WebRTC, no relay and no
    # screen — and this suite has caught a broken retry loop, an ARIA
    # mistake and a silent change in what clicking a row means.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: signal/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start the relay
        working-directory: signal
        run: |
          go build -o signal-server .
          ./signal-server &
          # The relay answers 404 at / and that is a working server.
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8080/ && break
            curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ | grep -q 404 && break
            sleep 1
          done

      - name: Serve the client
        working-directory: web
        run: |
          npm run build
          npx vite preview --port 4173 &
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:4173/ && exit 0
            sleep 1
          done
          echo 'the preview server never came up' >&2
          exit 1

      - name: The protocol, in two tabs
        working-directory: web
        run: npm run e2e

      - name: The app mark, in all five places it appears
        working-directory: web
        run: npm run check:mark

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: /tmp/client-*.png
          if-no-files-found: ignore

  vectors:
    name: vectors (Android, emulator)
    runs-on: ubuntu-latest
    # The suite that keeps the two implementations honest.
    #
    # androidTest/ needs a device because lazysodium loads a native
    # library, so none of it had ever run anywhere. VectorsTest checks
    # Android against docs/vectors/test-vectors.json — the same file
    # web/src/crypto/vectors.test.ts checks itself against — and it is
    # the only thing standing between a divergence and an unexplained SAS
    # mismatch during pairing, in the field, with nothing pointing at the
    # cause.
    #
    # It boots an emulator, so it is the slow job. It does not gate the
    # fast ones: signal, web and android all report on their own.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
        working-directory: android

      # KVM is what makes this minutes rather than tens of minutes.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          working-directory: android
          script: ./gradlew --no-daemon connectedDebugAndroidTest

      # connectedAndroidTest reports BUILD SUCCESSFUL when it runs no
      # tests at all, and prints nothing either way when they pass. A
      # green tick that cannot distinguish "the vectors match" from "the
      # vectors were never checked" is worse than no job, because it is
      # believed. So the count is read back and has to be plausible.
      - name: Prove the tests actually ran
        if: always()
        run: |
          # Searched rather than assumed: AGP has moved this path before,
          # and a hardcoded one that misses would read as "nothing ran".
          mapfile -t reports < <(find android/app/build/outputs -name '*.xml' \
            -path '*androidTest-results*' 2>/dev/null)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "::error::no instrumented test reports anywhere under android/app/build/outputs"
            find android/app/build/outputs -maxdepth 3 -type d 2>/dev/null || true
            exit 1
          fi
          printf 'report: %s\n' "${reports[@]}"
          count() { grep -ho "$1=\"[0-9]*\"" "${reports[@]}" | grep -o '[0-9]*' | paste -sd+ | bc; }
          total=$(count tests)
          failures=$(count failures)
          errors=$(count errors)
          echo "instrumented tests: ${total:-0} run, ${failures:-0} failed, ${errors:-0} errored"
          # The suite has five classes in it. One is a floor low enough to
          # never be wrong about, and high enough to catch an empty run.
          if [ "${total:-0}" -lt 1 ]; then
            echo "::error::the emulator ran zero tests — this job proves nothing"
            exit 1
          fi
          if [ "${failures:-0}" -ne 0 ] || [ "${errors:-0}" -ne 0 ]; then
            echo "::error::instrumented tests failed"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-test-results
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: warn
