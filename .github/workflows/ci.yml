name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  signal:
    name: signal (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: signal/go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -race -count=1

  web:
    name: web (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc -b --noEmit
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build

  android:
    name: android (Kotlin)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      # assembleDebug is the point of this job. The instrumented suite —
      # the vectors, storage and transport tests — needs a real device for
      # libsodium's native library, so CI cannot run it; what CI *can* do
      # is prove the app still compiles, which is the failure mode that
      # otherwise only shows up on someone's phone.
      - run: ./gradlew --no-daemon assembleDebug
      - run: ./gradlew --no-daemon testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-unit-test-results
          path: android/app/build/reports/tests/
