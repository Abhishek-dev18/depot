# coturn config for Depot's optional self-hosted TURN server.
# Realm, and the auth secret are passed via docker-compose.yml's `command:`
# (from .env.turn) rather than hardcoded here, so this file has no secrets
# in it and is safe to commit.

listening-port=3478
tls-listening-port=5349

min-port=49160
max-port=49200

# This container only serves one purpose — disable the interactive
# management CLI so it isn't sitting open even on the loopback interface.
no-cli

# Time-limited credentials only (set via --use-auth-secret on the command
# line) — no static username/password pairs to leak or rotate by hand.
no-auth-pings

# TLS is optional. If you have a certificate for TURN_REALM, uncomment the
# next two lines and mount the cert/key into the container; browsers will
# then also try turns:// (TURN-over-TLS), which gets through networks that
# block plain UDP/TCP TURN.
# cert=/etc/coturn/cert.pem
# pkey=/etc/coturn/key.pem

# Don't relay to addresses that are actually inside someone's private
# network — standard coturn hardening so this can't be abused as an open
# proxy into RFC1918 space.
no-loopback-peers
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255
